<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASC SMART SEAT | Official Examination Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #070b19 0%, #0d1b3e 50%, #070b19 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }
        .container {
            max-width: 580px;
            width: 100%;
            background: rgba(13, 27, 62, 0.75);
            border: 1px solid rgba(0, 198, 255, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 36px 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 3.2rem;
            margin-bottom: 12px;
        }
        h1 {
            background: -webkit-linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .sub {
            color: #94a3b8;
            font-size: 0.88rem;
            margin-bottom: 18px;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #0052d4, #4364f7);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 26px;
        }
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }
        .btn-primary {
            display: block;
            padding: 16px 24px;
            border-radius: 14px;
            background: linear-gradient(45deg, #0072ff, #00c6ff);
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 6px 24px rgba(0, 198, 255, 0.4);
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 198, 255, 0.6);
        }
        .btn-secondary {
            display: block;
            padding: 13px 20px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
        }
        .footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 0.78rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎓</div>
        <h1>KASC SMART SEAT</h1>
        <div class="sub">Kavery Arts and Science College (Autonomous), Mecheri</div>
        <div class="badge">PERIYAR UNIVERSITY THEORY EXAMINATIONS</div>

        <div class="btn-stack">
            <a href="student.html" class="btn-primary">
                📱 Open Student Seat Finder Portal
            </a>
            <a href="https://drive.google.com/file/d/1-ixuJBCMoOmz5aCRl7gki_W2doRiJPUn/view?usp=sharing" class="btn-secondary" target="_blank">
                💾 Download Admin Desktop App (.exe)
            </a>
        </div>

        <div class="footer">
            Developed by Divyavenugopal • Final Year B.Sc AI & DS
        </div>
    </div>
</body>
</html>
